name: Compilazione Blender DLSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Clona repository Blender
        run: |
          git clone -b dlss https://projects.blender.org/pmoursnv/blender.git .

      - name: Configura ambiente MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Scarica dipendenze precompilate
        run: |
          echo y | make.bat update

      - name: Genera file di build con CMake
        run: |
          cmake -S . -B build -DWITH_CYCLES_DEVICE_CUDA=ON -DWITH_DLSS=ON

      - name: Esegui compilazione
        run: |
          cmake --build build --config Release

      - name: Carica eseguibile compilato
        uses: actions/upload-artifact@v4
        with:
          name: Blender-DLSS-Windows
          path: build/bin/Release/
          
