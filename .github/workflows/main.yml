name: Compilazione Blender DLSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Clona repository Blender
        run: |
          git clone -b dlss https://projects.blender.org/pmoursnv/blender.git blender

      - name: Scarica SDK NVIDIA DLSS
        run: |
          git clone https://github.com/NVIDIA/DLSS.git dlss_sdk

      - name: Configura ambiente MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Scarica dipendenze precompilate
        run: |
          cd blender
          python build_files\utils\make_update.py

      - name: Genera file di build con CMake
        run: |
          cmake -S blender -B build -DWITH_DLSS=ON -DDLSS_SDK_ROOT=%CD%\dlss_sdk

      - name: Esegui compilazione
        run: |
          cmake --build build --config Release

      - name: Carica eseguibile compilato
        uses: actions/upload-artifact@v4
        with:
          name: Blender-DLSS-Windows
          path: build/bin/Release/
          
